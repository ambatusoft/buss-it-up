name: Check game

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      BUSS_TEST_CHROME: google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check generated HTML
        run: node build.mjs --check
      - name: Check the gameplay reference
        run: node scripts/refresh-reference.mjs --check
      - name: Check Story at a Pages project path
        run: node tests/browser/chrome.mjs story --http
      - name: Check decoded audio and queue timing
        run: node tests/browser/chrome.mjs audio
